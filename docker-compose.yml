services:
  rapigo-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - rapigo-network

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - rapigo-web
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rapigo-network

networks:
  rapigo-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
